<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to source folders
    # NOTE: trailing slash is critical — without it, "/var/www/html/approvals"
    # would also match (because "approvals" starts with "app"), causing 403 on the
    # /approvals route. The /-suffix forces a word-boundary match.
    <DirectoryMatch "^/var/www/html/(app|config|database|deploy)/">
        Require all denied
    </DirectoryMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
